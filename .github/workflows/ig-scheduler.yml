name: ig-scheduler

# Cloud Instagram poster. Fires every 15 minutes; posts whatever is due in
# instagram/schedule_queue.json (which is COMMITTED and pushed back after
# every run, so nothing double-posts).
#
# CUTOVER RULE: the local launchd job com.apeai.igscheduler on the Mac and
# this workflow must NEVER both be live. One owner at a time. The schedule
# trigger below is added only at cutover; until then this workflow is
# manual-only (workflow_dispatch) and inert.
#
# Videos are NOT in the repo. The queue references Google Drive files via
# instagram/drive_urls.json (public direct links); Instagram's servers fetch
# the video from Google at post time, same as the Mac did.
#
# Secrets: IG_ACCESS_TOKEN, IG_USER_ID (repo secrets). The repo's
# instagram/accounts.json contains placeholders only.

on:
  workflow_dispatch: {}   # manual test button (always available)
  schedule:
    - cron: "0 * * * *"      # hourly: each run loops ~58min internally (dense)

permissions:
  contents: write

concurrency:
  group: ig-posting
  cancel-in-progress: false

jobs:
  post-due:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Show queue state (no secrets)
        working-directory: instagram
        run: |
          python3 - <<'PY'
          import json
          q = json.load(open("schedule_queue.json"))
          pending = [i for i in q if i and not i.get("posted") and not i.get("error")]
          print(f"queue: {len(q)} total, {len(pending)} pending")
          for i in pending[:3]:
              print(f"  due {i['at']}: {i['caption'][:50]}")
          PY

      - name: Post due items (58-min dense loop)
        id: run
        working-directory: instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          # GitHub scheduled runs can lag by hours; this loop posts on a
          # 2-minute internal tick for ~58 minutes, independent of cron.
          # State is committed back after EVERY posting tick so a mid-run
          # crash can never cause double-posts.
          git config user.name "apeai-bot"
          git config user.email "actions@users.noreply.github.com"
          END=$(( $(date +%s) + 3480 ))
          CHANGED=false
          while [ $(date +%s) -lt $END ]; do
            DUE=$(python3 -c "
          import json
          from datetime import datetime, timezone
          q = json.load(open('schedule_queue.json'))
          now = datetime.now(timezone.utc)
          n = 0
          for i in q:
              if i.get('posted') or i.get('error'): continue
              due = datetime.fromisoformat(i['at'].replace('Z', '+00:00'))
              if due <= now: n += 1
          print(min(n, 5))
          " 2>/dev/null || echo 0)
            echo "tick $(date -u +%H:%M:%S): items due now (cap 5/tick): $DUE"
            if [ "$DUE" -gt 0 ]; then
              python3 ig_scheduler.py run --max 5 && CHANGED=true || true
              git add instagram/schedule_queue.json
              if ! git diff --cached --quiet; then
                git commit -m "ig queue state update [skip ci]" || true
              fi
            fi
            # Push whenever anything is unpushed (new state OR a push that
            # failed on an earlier tick). Rebase-retry defeats git races.
            if [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then
              for attempt in 1 2 3; do
                if git push origin main 2>/dev/null; then break; fi
                echo "push attempt $attempt failed - rebasing on remote and retrying"
                git fetch origin main && git rebase origin/main || true
                sleep 5
              done
            fi
            sleep 120
          done
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Commit queue state back (prevents double-posts)
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "apeai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/schedule_queue.json
          if git diff --cached --quiet; then
            echo "no queue changes -> nothing to commit"
          else
            git commit -m "ig queue state update [skip ci]"
            if ! git push origin main; then
              echo "push raced - pulling and retrying once"
              git pull --rebase origin main
              git push origin main
            fi
          fi
