name: bsky-scheduler

# Cloud Bluesky poster. Fires every 15 minutes; the scheduler posts only
# items whose due time is now or within 60s (--max-wait 60) and exits.
# Outside the 09:00-18:45 ET window nothing is due -> no-op run.
#
# STATE: the queue file (x-bluesky/bsky_scheduled_posts.json) IS tracked in
# git. After any change (posted flags, failures) the job commits it back to
# main, so the next run sees fresh state and nothing double-posts. If there
# is nothing to commit, the commit step no-ops quietly.
#
# Secrets: BSKY_HANDLE + BSKY_APP_PASSWORD (repo secrets, already set).
# Cron is UTC; the scheduler fires any overdue item on the next tick.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (cron is UTC; ET = UTC-4)
  workflow_dispatch: {}      # manual run button, for tests

permissions:
  contents: write

concurrency:
  group: bsky-posting
  cancel-in-progress: false

jobs:
  post-due:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: x-bluesky/package-lock.json

      - name: Install scheduler deps
        working-directory: x-bluesky
        run: npm ci --no-audit --no-fund

      - name: Show queue state (no secrets)
        run: |
          if [ -f x-bluesky/bsky_scheduled_posts.json ]; then
            python3 - <<'PY'
          import json
          q = json.load(open("x-bluesky/bsky_scheduled_posts.json"))
          pending = [i for i in q if i and not i.get("posted")]
          print(f"queue: {len(q)} total, {len(pending)} pending")
          for i in pending[:3]:
              print(f"  due {i['at']}: {i['text'][:60]}...")
          PY
          else
            echo "queue file missing -> no-op run"
          fi

      - name: Post due items
        working-directory: x-bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ ! -f bsky_scheduled_posts.json ]; then
            echo "no queue file -> no-op"
            exit 0
          fi
          DUE=$(python3 -c "
          import json, time
          q = json.load(open('bsky_scheduled_posts.json'))
          now = time.time()
          due = sum(1 for i in q if i and not i.get('posted')
                    and time.mktime(time.strptime(i['at'].replace('Z', '+0000'), '%Y-%m-%dT%H:%M:%S%z')) <= now + 60)
          print(due)
          " 2>/dev/null || echo 0)
          echo "items due now: $DUE"
          if [ "$DUE" -gt 0 ]; then
            node src/scheduler.js --max-wait 60
          else
            echo "nothing due this tick -> no-op (no login)"
          fi

      - name: Commit queue state back (prevents double-posts)
        run: |
          git config user.name "apeai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add x-bluesky/bsky_scheduled_posts.json
          if git diff --cached --quiet; then
            echo "no queue changes -> nothing to commit"
          else
            git commit -m "bsky queue state update [skip ci]"
            if ! git push origin main; then
              echo "push raced with another run - pulling and retrying once"
              git pull --rebase origin main
              git push origin main
            fi
          fi
