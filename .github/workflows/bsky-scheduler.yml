name: bsky-scheduler

# Cloud Bluesky poster. Cron fires hourly; each run loops internally on a
# 1-minute tick for ~58 minutes (see "58-min dense loop" below), so the
# effective cadence is not tied to how late GitHub starts the job. The
# scheduler posts only items whose due time is now or within 60s
# (--max-wait 60) and exits. Outside the 09:00-18:45 ET window nothing is
# due -> no-op run.
#
# RATE: --min-gap 900 is the account's 15 minute cadence, enforced by reading
# posted_at out of the queue itself (see x-bluesky/src/rate_governor.js). A
# per-process sleep could not work here: this loop re-invokes the script every
# minute, so the limit has to survive across invocations. Before this, a delayed
# run fired the whole backlog at once - measured 78 posts in 9.8 seconds.
#
# --max-age-min 0 keeps every late post instead of dropping it. Set it to a
# number of minutes to discard posts that are further behind than that, which
# stops a long cron outage from backing the queue up permanently.
#
# STATE: the queue file (x-bluesky/bsky_scheduled_posts.json) IS tracked in
# git. After any change (posted flags, failures) the job commits it back to
# main, so the next run sees fresh state and nothing double-posts. If there
# is nothing to commit, the commit step no-ops quietly.
#
# Secrets: BSKY_HANDLE + BSKY_APP_PASSWORD (repo secrets, already set).
# Cron is UTC; the scheduler fires any overdue item on the next tick.

on:
  schedule:
    - cron: "0 * * * *"      # hourly: each run loops ~58min internally (dense)
  workflow_dispatch: {}      # manual run button, for tests

permissions:
  contents: write

concurrency:
  group: bsky-posting
  cancel-in-progress: false

jobs:
  post-due:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: x-bluesky/package-lock.json

      - name: Install scheduler deps
        working-directory: x-bluesky
        run: npm ci --no-audit --no-fund

      - name: Show queue state (no secrets)
        run: |
          if [ -f x-bluesky/bsky_scheduled_posts.json ]; then
            python3 - <<'PY'
          import datetime
          import json
          q = [i for i in json.load(open("x-bluesky/bsky_scheduled_posts.json")) if i]
          pending = [i for i in q if not i.get("posted") and not i.get("skipped")]
          posted = sum(1 for i in q if i.get("posted"))
          dropped = sum(1 for i in q if i.get("skipped"))
          now = datetime.datetime.now(datetime.timezone.utc)
          overdue = sum(
              1 for i in pending
              if datetime.datetime.fromisoformat(i["at"].replace("Z", "+00:00")) <= now
          )
          print(
              f"queue: {len(q)} total | {posted} posted | "
              f"{len(pending)} pending ({overdue} overdue) | {dropped} dropped as stale"
          )
          last = max((i.get("posted_at") for i in q if i.get("posted_at")), default=None)
          if last:
              print(f"  last post was at {last}")
          for i in pending[:3]:
              print(f"  due {i['at']}: {i['text'][:60]}...")
          PY
          else
            echo "queue file missing -> no-op run"
          fi

      - name: Post due items (58-min dense loop)
        working-directory: x-bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          # GitHub scheduled runs can lag by hours; this loop posts on a
          # 1-minute internal tick for ~58 minutes, independent of cron.
          # State is committed back after EVERY posting tick so a mid-run
          # crash can never cause double-posts.
          git config user.name "apeai-bot"
          git config user.email "actions@users.noreply.github.com"
          END=$(( $(date +%s) + 3480 ))
          while [ $(date +%s) -lt $END ]; do
            # datetime, not time.mktime: mktime reads the timestamp as local
            # time and silently ignores the %z offset, which is only correct on
            # a UTC runner. Skipped rows are not due and must not re-trigger.
            DUE=$(python3 -c "
          import datetime, json
          q = json.load(open('bsky_scheduled_posts.json'))
          now = datetime.datetime.now(datetime.timezone.utc)
          horizon = now + datetime.timedelta(seconds=60)
          due = 0
          for i in q:
              if not i or i.get('posted') or i.get('skipped'):
                  continue
              if datetime.datetime.fromisoformat(i['at'].replace('Z', '+00:00')) <= horizon:
                  due += 1
          print(due)
          " 2>/dev/null || echo 0)
            echo "tick $(date -u +%H:%M:%S): items due now: $DUE"
            if [ "$DUE" -gt 0 ]; then
              node src/scheduler.js --max-wait 60 --min-gap 900 --max-posts 6 --max-age-min 0 || true
              # -C "$GITHUB_WORKSPACE" keeps the pathspec repo-root-relative.
              # This step's working-directory is x-bluesky, so a bare
              # "x-bluesky/..." pathspec resolved to x-bluesky/x-bluesky/...
              # and exited 128, discarding the posted flags for the whole tick.
              # || true: a staging failure must never kill the tick loop, or
              # the run dies before its commit step and the posted flags are
              # lost, which re-fires the same items on every run.
              git -C "$GITHUB_WORKSPACE" add x-bluesky/bsky_scheduled_posts.json || true
              if ! git diff --cached --quiet; then
                git commit -m "bsky queue state update [skip ci]" || true
              fi
            fi
            # Push whenever anything is unpushed (new state OR a push that
            # failed on an earlier tick). Rebase-retry defeats git races.
            if [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then
              for attempt in 1 2 3; do
                if git push origin main 2>/dev/null; then break; fi
                echo "push attempt $attempt failed - rebasing on remote and retrying"
                git fetch origin main && git rebase origin/main || true
                sleep 5
              done
            fi
            sleep 60
          done

      - name: Commit queue state back (prevents double-posts)
        # always(): state must be saved even if the posting step died, since
        # a skipped commit is what makes the next run re-post the same items.
        if: always()
        run: |
          git config user.name "apeai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add x-bluesky/bsky_scheduled_posts.json || true
          if git diff --cached --quiet; then
            echo "no queue changes -> nothing to commit"
          else
            git commit -m "bsky queue state update [skip ci]"
            if ! git push origin main; then
              echo "push raced with another run - pulling and retrying once"
              git pull --rebase origin main
              git push origin main
            fi
          fi
